<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Flash-Card Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cards">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='14' width='52' height='36' rx='6' fill='none' stroke='%23333' stroke-width='5'/%3E%3Cpath d='M19 30h26M19 40h16' stroke='%23333' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23ffffff'/%3E%3Crect x='34' y='46' width='112' height='76' rx='10' fill='none' stroke='%23333' stroke-width='8'/%3E%3Cpath d='M58 84h64M58 104h40' stroke='%23333' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --font-ui: "Avenir Next", Avenir, "Helvetica Neue", Helvetica,
               "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    --green:#43a047;
    --red:#e53935;
    --slate:#607d8b;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none;}
  body{
    background:#fff; color:#000;
    font-family:var(--font-ui);
    -webkit-text-size-adjust:100%;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation;
  }

  /* ─────────────  カード画面  ───────────── */
  #card-view{
    position:fixed; inset:0; background:#fff;
    /* ボタン行の上端。解答欄がここに潜り込まないよう共有する */
    --btn-top:min(calc(var(--safe-t) + 75%), calc(100% - var(--safe-b) - 110px));
  }

  /* Pythonista 版のレイアウトをそのまま踏襲
     word: y=14%,  mean: y=44%,  buttons: y=75%,  stat: 下端 */
  .lbl{
    position:absolute; left:20px; right:20px;
    display:flex; align-items:center; justify-content:center;
    text-align:center; line-height:1.22;
    white-space:pre-wrap; word-break:break-word; overflow:hidden;
  }
  #word{
    top:calc(var(--safe-t) + 14%); height:26%;
    font-weight:700; font-size:40px;
  }
  #mean{
    top:calc(var(--safe-t) + 44%); height:26%;
    font-weight:400; font-size:30px; color:#555;
    transition:opacity .12s ease;
  }
  #mean.hidden-face{opacity:.25;}
  .lbl > .inner{max-width:100%; min-width:0;}
  /* 最小サイズでも入りきらない長文は、切り落とさずスクロールさせる */
  .lbl.scroll{align-items:flex-start; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .lbl.scroll > .inner{width:100%;}
  /* 複数行の答えは「番号だけ左端揃え・ブロック全体は中央寄せ」。
     既定では折り返さず、縮めても入らないときだけ .wrap を付けて折り返す */
  .lbl > .inner.block{text-align:left; white-space:pre;}
  .lbl > .inner.block.wrap{white-space:pre-wrap;}

  /* ── 入力して答えるとき (穴埋め / 選択 / 記述) の解答欄 ── */
  #response-panel{display:contents;}
  #answer-area{
    position:absolute; left:20px; right:20px;
    top:calc(var(--safe-t) + 41%);
    display:none; flex-direction:column; gap:10px;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    /* 下端はボタン行の手前まで。キーボードが出ているときはその上まで */
    max-height:min(
      calc(var(--btn-top) - var(--safe-t) - 41% - 10px),
      calc(100% - var(--kb, 0px) - var(--safe-t) - 41% - 10px));
  }
  #answer-area.on{display:flex;}
  /* 入力式のときは問題文を上に広げる。丸ボタンの下から始める */
  body.answering #word{
    top:calc(var(--safe-t) + 86px);
    height:calc(41% - 94px);
  }
  /* 回答欄と操作ボタンを1つのパネルにして、入力欄のすぐ下に置く。
     --kb は Visual Viewport が検出したソフトキーボードの高さ。 */
  body.answering #response-panel{
    position:absolute; z-index:4;
    left:16px; right:16px;
    top:calc(var(--safe-t) + 41%);
    bottom:calc(var(--safe-b) + 42px + var(--kb, 0px));
    display:flex; flex-direction:column; gap:12px;
    min-height:0; overflow:hidden;
  }
  body.answering #answer-area{
    position:static; flex:0 1 auto; min-height:0; max-height:calc(100% - 70px);
    padding:2px; overflow-y:auto;
  }
  body.answering #answer-area.scroll-controls{flex:1 1 auto;}
  body.answering #btnrow{
    position:static; flex:0 0 auto; width:100%;
  }
  .ans-row{min-width:0;}
  .ans-row .line{display:flex; align-items:center; gap:8px;}
  .ans-row.choice-row .line, .ans-row.self-row .line{align-items:flex-start;}
  .ans-row .n{
    flex:0 0 auto; min-width:2.4em; text-align:right;
    padding-top:11px; font-size:16px; color:#555;
  }
  .ans-row input:not([type="hidden"]), .ans-row textarea{
    flex:1 1 auto; min-width:0; padding:8px 10px;
    border:1px solid #c8c8cc; border-radius:8px;
    font-family:var(--font-ui); font-size:17px; background:#fff; color:#000;
    -webkit-user-select:text; user-select:text;
  }
  .ans-row textarea{min-height:96px; line-height:1.5; resize:none;}
  .ans-row input:focus, .ans-row textarea:focus{outline:none; border-color:#0a58ca;}
  .ans-row .mark{flex:0 0 auto; width:1.3em; padding-top:10px; text-align:center; font-size:19px;}
  .ans-row.ok  input:not([type="hidden"]), .ans-row.ok textarea{border-color:var(--green); background:#f3fbf4;}
  .ans-row.ok  .mark{color:var(--green);}
  .ans-row.ng  input:not([type="hidden"]), .ans-row.ng textarea{border-color:var(--red); background:#fdf4f4;}
  .ans-row.ng  .mark{color:var(--red);}
  .ans-row .correct{
    margin:3px 0 2px calc(2.4em + 8px);
    font-size:15px; color:var(--green); white-space:pre-wrap; word-break:break-word;
  }
  .ans-row.self-row .correct, .ans-row.choice-row .correct{margin-left:calc(2.4em + 8px);}
  .answer-hint{margin:5px 0 0 calc(2.4em + 8px); font-size:12px; color:#777;}
  .choice-grid{
    flex:1 1 auto; min-width:0;
    display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:8px;
  }
  .choice-grid.long{grid-template-columns:1fr;}
  .choice-btn{
    min-height:48px; padding:9px 12px;
    border:2px solid #c8c8cc; border-radius:10px;
    background:#fff; color:#222; text-align:left;
    font-family:var(--font-ui); font-size:16px; line-height:1.35; cursor:pointer;
  }
  .choice-grid.binary .choice-btn{text-align:center; font-size:25px; font-weight:700;}
  .choice-btn.selected{border-color:#0a58ca; background:#eaf2ff; color:#064ca8;}
  .choice-btn.correct-choice{border-color:var(--green); background:#eaf7ec; color:#237a28;}
  .choice-btn.wrong-choice{border-color:var(--red); background:#fceded; color:#b32622;}
  .choice-btn:disabled{opacity:1; cursor:default;}

  #stat{
    position:absolute; left:20px; right:20px;
    bottom:calc(var(--safe-b) + 20px);
    text-align:center; font-size:14px; color:#666;
  }
  body.kb-open #stat{display:none;}

  #btnrow{
    position:absolute; left:20px; right:20px;
    /* 基本は Pythonista と同じ 75% の位置。画面が低いときだけ成績表示に
       かぶらないよう下端から持ち上げる */
    top:var(--btn-top);
    display:flex; gap:20px;
  }
  .bigbtn{
    flex:1 1 0; height:64px; border:0; border-radius:8px;
    font-family:var(--font-ui); font-weight:700; font-size:34px;
    color:#fff; cursor:pointer;
  }
  .bigbtn:active{filter:brightness(.88);}
  .bigbtn:disabled{opacity:.35;}
  #btn-correct{background:var(--green);}
  #btn-wrong{background:var(--red);}
  #btn-back{background:var(--slate);}
  /* 自動採点の結果を「たぶんこっち」として指し示す */
  .bigbtn.suggest{box-shadow:0 0 0 3px #222;}
  #btn-check{display:none; background:#0a58ca; font-size:22px;}
  #btnrow.input-mode .bigbtn{display:none;}
  #btnrow.input-mode #btn-check, #btnrow.input-mode #btn-back{display:block;}
  #btnrow.input-mode #btn-back{flex:0 0 74px; font-size:28px;}
  body.answering .bigbtn{height:58px;}

  .roundbtn{
    position:absolute; top:calc(var(--safe-t) + 14px);
    width:64px; height:64px; border:0; border-radius:32px;
    font-family:"Helvetica Neue", Helvetica, var(--font-ui);
    font-size:34px; line-height:1; cursor:pointer;
  }
  .roundbtn:active{filter:brightness(.9);}
  #btn-menu{right:14px; background:rgba(230,230,230,.75); color:#000;}
  #btn-exit{right:88px; background:rgba(230,77,77,.75); color:#fff;}

  /* 横向きなど画面が低いとき: 文字が右上の丸ボタンに潜り込まないよう詰める */
  @media (max-height:500px){
    .roundbtn{width:48px; height:48px; border-radius:24px; font-size:26px;
              top:calc(var(--safe-t) + 8px);}
    #btn-menu{right:12px;}
    #btn-exit{right:68px;}
    #word{top:calc(var(--safe-t) + 62px); height:32%;}
    #mean{top:calc(var(--safe-t) + 62px + 32%); height:22%;}
    body.answering #word{top:calc(var(--safe-t) + 62px); height:calc(41% - 70px);}
  }

  /* ─────────────  ダイアログ (console.alert 相当)  ───────────── */
  #dlg-layer{
    position:fixed; inset:0; z-index:50;
    background:rgba(0,0,0,.28);
    display:none; align-items:center; justify-content:center;
    padding:24px; padding-top:calc(24px + var(--safe-t)); padding-bottom:calc(24px + var(--safe-b));
    -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  }
  #dlg-layer.on{display:flex;}
  #dlg{
    width:100%; max-width:340px; max-height:100%;
    background:#fff; border-radius:14px; overflow:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.28);
    padding:20px 18px 14px;
  }
  #dlg h2{margin:0 0 4px; font-size:18px; font-weight:700; text-align:center;}
  #dlg p{margin:0 0 14px; font-size:14px; color:#666; text-align:center; white-space:pre-wrap;}
  #dlg p:empty{display:none; margin:0;}
  #dlg .opts{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  #dlg button{
    width:100%; padding:13px 10px; border:0; border-radius:9px;
    background:#f0f0f2; color:#0a58ca;
    font-family:var(--font-ui); font-size:16px; cursor:pointer;
  }
  #dlg button:active{background:#e2e2e6;}
  #dlg button.primary{background:#0a58ca; color:#fff;}
  #dlg button.danger{color:#c62828;}

  /* ─────────────  エディタ画面  ───────────── */
  #editor{
    position:fixed; inset:0; z-index:40; background:#f7f7f8;
    display:none; flex-direction:column;
    padding-top:var(--safe-t); padding-bottom:var(--safe-b);
  }
  #editor.on{display:flex;}
  .ed-bar{
    display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:#fff; border-bottom:1px solid #e2e2e4;
    flex:0 0 auto;
  }
  .ed-bar h1{flex:1 1 auto; margin:0; font-size:17px; font-weight:700;
             overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ed-bar button{
    border:0; border-radius:8px; padding:9px 13px;
    background:#ececed; color:#0a58ca;
    font-family:var(--font-ui); font-size:15px; cursor:pointer; white-space:nowrap;
  }
  .ed-bar button.primary{background:#0a58ca; color:#fff;}
  #ed-list{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px;}
  .ed-empty{padding:40px 20px; text-align:center; color:#888; font-size:15px; line-height:1.7;}
  .ed-card{
    background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:10px;
    box-shadow:0 1px 3px rgba(0,0,0,.09);
  }
  .ed-card .no{font-size:12px; color:#888; font-weight:700; margin-bottom:4px;}
  .ed-card .q{font-size:15px; line-height:1.5; margin-bottom:6px; word-break:break-word;}
  .ed-card .a{font-size:13px; color:#666; line-height:1.5; white-space:pre-wrap;
              word-break:break-word; max-height:6em; overflow:hidden;}
  .ed-card .row{display:flex; gap:8px; margin-top:10px;}
  .ed-card .row button{
    border:0; border-radius:7px; padding:7px 12px; background:#f0f0f2;
    color:#0a58ca; font-family:var(--font-ui); font-size:14px; cursor:pointer;
  }
  .ed-card .row button.del{color:#c62828;}

  /* 入力フォーム */
  #form-layer{
    position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.28);
    display:none; align-items:flex-end; justify-content:center;
  }
  #form-layer.on{display:flex;}
  #form-box{
    width:100%; max-width:560px; max-height:92%;
    background:#fff; border-radius:16px 16px 0 0;
    display:flex; flex-direction:column; overflow:hidden;
    padding-bottom:var(--safe-b);
  }
  #form-box .ed-bar{border-bottom:1px solid #e2e2e4;}
  #form-body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 20px;}
  #form-body label{display:block; font-size:13px; color:#666; margin:12px 0 5px; font-weight:700;}
  #form-body input, #form-body textarea, #form-body select{
    width:100%; padding:10px 12px; border:1px solid #d5d5d8; border-radius:9px;
    font-family:var(--font-ui); font-size:16px; background:#fff; color:#000;
    -webkit-user-select:text; user-select:text; resize:vertical;
  }
  #form-body textarea{line-height:1.55;}
  #form-body .hint{font-size:12px; color:#999; margin-top:6px; line-height:1.6;}
</style>
</head>
<body>

<!-- ══════════ カード画面 ══════════ -->
<div id="card-view">
  <div class="lbl" id="word"></div>
  <div class="lbl" id="mean"></div>
  <div id="response-panel">
    <div id="answer-area"></div>
    <div id="btnrow">
      <button class="bigbtn" id="btn-check">答え合わせ</button>
      <button class="bigbtn" id="btn-correct">✔︎</button>
      <button class="bigbtn" id="btn-wrong">✘</button>
      <button class="bigbtn" id="btn-back" aria-label="前の問題に戻る">↩︎</button>
    </div>
  </div>
  <button class="roundbtn" id="btn-exit">✕</button>
  <button class="roundbtn" id="btn-menu">☰</button>
  <div id="stat"></div>
</div>

<!-- ══════════ エディタ ══════════ -->
<div id="editor">
  <div class="ed-bar">
    <button id="ed-close">閉じる</button>
    <h1 id="ed-title">問題の編集</h1>
    <button id="ed-add" class="primary">＋ 追加</button>
  </div>
  <div id="ed-list"></div>
</div>

<!-- ══════════ ダイアログ ══════════ -->
<div id="dlg-layer"><div id="dlg">
  <h2 id="dlg-title"></h2>
  <p id="dlg-msg"></p>
  <div class="opts" id="dlg-opts"></div>
</div></div>

<!-- ══════════ 入力フォーム ══════════ -->
<div id="form-layer"><div id="form-box">
  <div class="ed-bar">
    <button id="form-cancel">キャンセル</button>
    <h1 id="form-title"></h1>
    <button id="form-save" class="primary">保存</button>
  </div>
  <div id="form-body"></div>
</div></div>

<!-- 初期データ (Pythonista 版 list.json と同一) -->
<script type="application/json" id="seed-deck">
[
  [1, "DRAM, MOSFET, IGBT, GPU, LED, SRAM を個別半導体デバイスと集積回路 (IC) に分類せよ。",
      "(1)DRAM: IC\n(2)MOSFET: 個別半導体デバイス\n(3)IGBT: 個別半導体デバイス\n(4)GPU: IC\n(5)LED: 個別半導体デバイス\n(6)SRAM: IC"],
      
  [3, "pn接合の(1)障壁により整流作用を発現することから、(2)を(3)に変換する回路に用いられる。(4)では一方の極性だけを通し、(5)では正負両方の極性を同方向の(3)に変換する。",
      "(1)電位\n(2)交流\n(3)直流\n(4)半波整流\n(5)全波整流"],

  [4, "導体-n型半導体接合の(1)障壁により整流作用を発現し、その障壁の高さは導体の(2)と半導体の(3)の差によって決まる。整流ダイオードと比較して(4)降下は小さく、(5)時間も極めて短いため高速スイッチング用途に適しているが、(6)が大きく(7)が低いという欠点がある。",
      "(1)ショットキー\n(2)仕事関数\n(3)電子親和力\n(4)順方向電圧\n(5)逆回復\n(6)漏れ電流\n(7)逆耐圧"],

  [5, "逆方向に一定以上の電圧((1)電圧)がかかるとpn接合の(2)が薄くなるため、(3)により急激に電流が流れる。この(4)現象を利用することで、LED回路の定電圧電源などに用いられる。",
      "(1)ツェナー\n(2)空乏層\n(3)トンネル効果\n(4)降伏"],

  [8, "トランジスタのスイッチング機能: 0.7V以上の(1)-(2)間電圧をかけると電子が(3)障壁を越えて(4)が流れスイッチON((5)領域)となる。0.7V以下では電子が(3)障壁を越えられず(4)が流れないためスイッチOFF((6)領域)となる。",
      "(1)ベース\n(2)エミッタ\n(3)電位\n(4)コレクタ電流\n(5)飽和\n(6)遮断"],

  [11,"BJTの活性領域: (1)機能に寄与する領域で、(2)電流は(3)電流に(4)を掛けた値に比例する。(2)-(5)間電圧がある程度以上であれば(2)電流はほぼ一定となり主に(3)電流の大きさに依存する。",
      "(1)増幅\n(2)コレクタ\n(3)ベース\n(4)直流電流増幅率\n(5)エミッタ"],

  [14,"NチャネルMOSFET: (1)-(2)間に電圧を加えると(3)型半導体中の(4)がボディ側に引き寄せられ(1)付近が相対的に(5)電位となる。その結果チャネルが形成され(6)-(2)間が導通する。加える電圧を大きくするとチャネルが厚くなりより多くの電流が流れるためMOSFETは(7)としても機能する。",
      "(1)ゲート\n(2)ソース\n(3)p\n(4)ホール\n(5)負\n(6)ドレイン\n(7)スイッチ"],

  [16,"パワーMOSFET: 高(1)かつ高速(2)特性を持つことからカーエレクトロニクスなどの電力制御に広く利用されている。主に垂直方向にゲートを埋め込む(3)構造が採用され、セルサイズの低減が図られている。材料にはワイドバンドギャップの(4)や(5)が用いられる。",
      "(1)耐圧\n(2)スイッチング\n(3)トレンチ\n(4)SiC\n(5)GaN"],

  [17,"IGBTの構造: MOSFETと同様の(1)とBJTと同様の(2)、コレクタの3端子を持つ。表面から順に(3)層、(4)層、(5)層、(6)層で構成されており、添え字の+と−はそれぞれ(7)の高低を示している。",
      "(1)ゲート\n(2)エミッタ\n(3)N+\n(4)Pエミッタ\n(5)N-ドリフト\n(6)P+コレクタ\n(7)ドーピング濃度"],

  [18,"NチャネルIGBTの等価回路: (1)型MOSFETと(2)型BJTを接続した回路で表すことができる。MOSFETがONになるとBJTの(3)電流が流れ結果として(4)電流が増幅される。",
      "(1)Nチャネル\n(2)PNP\n(3)ベース\n(4)コレクタ"],

  [19,"IGBTの動作: ゲート電圧を加えるとチャネルが形成され電子が(1)層から(2)層を通って(3)層に到達する。同時に(4)層からはホールが注入されることから(3)層内で電子とホールの密度が増加し(5)変調が生じてIGBTでは低(6)が実現する。",
      "(1)N+\n(2)Pエミッタ\n(3)N-ドリフト\n(4)P+コレクタ\n(5)伝導度\n(6)オン抵抗"],

  [21,"サイリスタの構造: (1)からカソードに向けてPNPNの4層構造を持ち、Pゲート品は(2)層目の(3)層に、Nゲート品は(4)層目の(5)層にゲートが存在する。",
      "(1)アノード\n(2)3\n(3)P\n(4)2\n(5)N"],

  [22,"サイリスタ(Pゲート品)の動作原理: 等価回路は交差接続した(1)型BJT((2)側)と(3)型BJT(カソード側)で構成される。ゲート信号を加えると(3)型が動作することで(1)型もONとなる。これにより相互に電流を供給し合い、ゲート信号がゼロでも(2)からカソードに電流が流れ続ける。",

      "(1)MOSFET\n(2)キャパシタ\n(3)ワード\n(4)ビット\n(5)ランダム"],

  [25,"DRAMの書き込み/読み出し: 書き込みでは(1)線を高電位にしてMOSFETをONにし、(2)線の電位により(3)を充電すれば『1』、放電すれば『0』が書き込まれる。読み出しでは(1)線を高電位にしてMOSFETをONにすると、『1』の場合は(3)から放電電流が流れ(2)線の電位が(4)し、『0』の場合は放電電流が流れないため(2)線の電位はわずかに(5)する。",
      "(1)ワード\n(2)ビット\n(3)キャパシタ\n(4)上昇\n(5)降下"],

  [26,"DRAMのリフレッシュ: (1)電流によりキャパシタが(2)するため時間が経過するとデータが失われる。この(3)性のために数ミリ秒〜数十ミリ秒ごとに全ビットのデータを読み出して再書き込みすることでキャパシタの(4)を回復させてデータを保持する。",
      "(1)リーク\n(2)自然放電\n(3)揮発\n(4)電荷"],

  [27,"DRAMインターフェース: (1)は(2)の立ち上がりエッジのみに(3)して動作し、1(2)あたり1データを転送する。(4)は立ち上がりと立ち下がりのエッジに(3)し、1(2)あたり2データを転送するため、転送速度が(1)の2倍になる。",
      "(1)SDR\n(2)クロック\n(3)同期\n(4)DDR"],

  [28,"SRAMセル: 2つの(1)が互いに出力と入力を接続する(2)を形成し、2つの安定状態を持つ(3)として動作する。各インバーターの出力ノードはPMOSとNMOSの(4)端子を共有している。(5)線の電位によって2つのアクセス用MOSFETをオン・オフすることで(6)線とセルの接続を制御する。",
      "(1)CMOSインバータ\n(2)相互帰還構造\n(3)ラッチ回路\n(4)ドレイン\n(5)ワード\n(6)ビット"],

  [29,"SRAMの書き込み/読み取り: (1)線を高電位にするとアクセス用MOSFETがONになり、(2)と(3)線が接続される。2本の(3)線に書き込みたい論理値に応じた電位を印加することで(4)の安定状態が切り替わりデータが書き込まれる。同様に(2)と(3)線が接続されると保持された論理値に応じて(3)線の電位がわずかに変化し、その差を(5)で増幅してデータを読み取る。",
      "(1)ワード\n(2)メモリセル\n(3)ビット\n(4)CMOSインバーター\n(5)センスアンプ"],

  [30,"フラッシュメモリセル: 基板上に(1)→(2)→(3)→(4)の順に形成されており、(2)を(1)と(3)で挟むことで電子を閉じ込め情報を保持している。",
      "(1)トンネル酸化膜\n(2)浮遊ゲート\n(3)絶縁膜\n(4)制御ゲート"],

  [31,"フラッシュメモリ書き込み: (1)に4〜6V、(2)に約10Vを印加してチャネルを形成すると、(3)から(1)へ電子が加速される。(4)と呼ばれるこれらの電子の一部が(5)を通って(6)に蓄積され、論理値0として記録される。",
      "(1)ドレイン\n(2)ゲート\n(3)ソース\n(4)ホットエレクトロン\n(5)トンネル酸化膜\n(6)浮遊ゲート"],

  [32,"フラッシュメモリ読み出し: ゲートとドレインに正電圧を印加すると、論理値0の場合浮遊ゲートに蓄積されている電子の(1)により(2)が形成されず、(3)から(4)にはごく僅かな電流しか流れない。一方論理値1の場合電子が蓄積されていないため(2)が形成され、(3)から(4)に電流が流れる。",
      "(1)遮蔽効果\n(2)チャネル\n(3)ドレイン\n(4)ソース"],

  [33,"フラッシュメモリのタイプ: (1)型はセルを(2)接続しワード線・ビット線・(3)線を共有することで高(4)・低(5)・大(6)を実現しているが(7)は不可である。一方(8)型はセルを(9)接続し各線が独立しているため(7)は可能であるが低(4)・高(5)・小(6)となる。",
      "(1)NAND\n(2)直列\n(3)ソース\n(4)集積\n(5)コスト\n(6)容量\n(7)ランダムアクセス\n(8)NOR\n(9)並列"]
]

<script>
'use strict';

/* この文字列はメニューに出る。iPhone 側が古い版を掴んでいないかの確認用 */
const APP_VERSION = '2026-08-05e';

/* ══════════════════════════════════════════════════════════
   版ずれの自己修復

   ブラウザやホーム画面アプリが古い index.html を握ったままだと、
   問題ファイルだけ新しくなって挙動が噛み合わなくなる。
   version.json (キャッシュ経由なしで取得) と APP_VERSION を突き合わせ、
   食い違っていたらキャッシュと Service Worker を捨てて読み直す。
   ══════════════════════════════════════════════════════════ */
async function fetchLatestVersion() {
  try {
    const res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return null;
    const v = (await res.json()).version;
    return typeof v === 'string' ? v : null;
  } catch (e) { return null; }
}

async function purgeAndReload(v) {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) { /* 消せなくてもクエリ付きで読み直せば新しいものが来る */ }
  location.replace(location.pathname + '?v=' + encodeURIComponent(v));
}

/* silent=true なら «古いときだけ» 黙って直す (起動時用) */
async function checkForUpdate(silent) {
  const latest = await fetchLatestVersion();
  if (!latest) {
    if (!silent) await alertDialog('確認できません', '通信できませんでした', 'OK');
    return;
  }
  if (latest === APP_VERSION) {
    if (!silent) await alertDialog('最新です', 'ver ' + APP_VERSION, 'OK');
    return;
  }
  /* 読み直しても直らない場合に往復し続けないよう 1 回だけにする */
  let tried = null;
  try { tried = sessionStorage.getItem('flashcards.reloadFor'); } catch (e) {}
  if (tried === latest) {
    if (!silent) {
      await alertDialog('更新できません',
        `新しい版 (${latest}) があるはずですが読み込めません。\n` +
        'Safari の履歴とWebサイトデータを消去してください。', 'OK');
    }
    return;
  }
  try { sessionStorage.setItem('flashcards.reloadFor', latest); } catch (e) {}
  if (!silent) await alertDialog('更新します', `ver ${APP_VERSION} → ${latest}`, 'OK');
  await purgeAndReload(latest);
}

/* ══════════════════════════════════════════════════════════
   ストレージ (localStorage が使えない環境ではメモリに退避)
   ══════════════════════════════════════════════════════════ */
const LAST_KEY   = 'flashcards.lastFile';
const LOCAL_KEY  = 'flashcards.localFiles';
const editKey    = f => 'flashcards.edit.'  + f;   // ファイルを編集した内容
const cacheKey   = f => 'flashcards.cache.' + f;   // 取得済みファイル (圏外用)

const store = (() => {
  let ok = true;
  try {
    localStorage.setItem('__t', '1');
    localStorage.removeItem('__t');
  } catch (e) { ok = false; }
  const mem = {};
  return {
    persistent: ok,
    get(k)    { try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch (e) { return mem[k] ?? null; } },
    set(k, v) { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } },
    del(k)    { try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch (e) { delete mem[k]; } },
  };
})();

/* ══════════════════════════════════════════════════════════
   問題リスト = lists/ 以下の JSON ファイル
     lists/index.json … 選択肢になるファイルの一覧
     local:〜         … 端末の中だけにあるリスト (読み込み / 新規作成)
   ══════════════════════════════════════════════════════════ */
let entries    = [];    // [{file, name, local}]
let activeFile = null;  // 'semiconductor.json' など
let activeName = '';
let cards      = [];    // 現在のリストの中身
let isEdited   = false; // ファイルから書き換えられているか
let cardSource = '-';   // カードをどこから読んだか (診断用)

const isLocal = f => String(f).startsWith('local:');

/* 出題形式
     ''      … めくって答えを見るだけ (Pythonista 版と同じ)
     'fill'  … 問題文の (1)(2)… に対応する入力欄を出す穴埋め
     'write' … 答えを 1 つの入力欄に書く用語記述式 (自動採点)
     'self'  … 同じく入力欄だが、長い説明用に○×を付けず模範解答だけ出す */
const TYPES = ['', 'fill', 'write', 'self'];
const normType = t => (TYPES.includes(String(t || '').toLowerCase()) ? String(t || '').toLowerCase() : '');

/* [番号, 問題文, 答え] / [番号, 問題文, 答え, 形式] / {no,q,a,type} を受ける */
function normalizeCards(raw) {
  if (!Array.isArray(raw)) throw new Error('配列ではありません');
  return raw.map((row, i) => {
    if (Array.isArray(row)) {
      if (row.length < 3) throw new Error(`${i + 1} 番目の要素の形式が違います`);
      return [row[0], String(row[1] ?? ''), String(row[2] ?? ''), normType(row[3])];
    }
    if (row && typeof row === 'object') {
      const no = row.no ?? row.n ?? (i + 1);
      const q = row.q ?? row.question ?? row.問題 ?? '';
      const a = row.a ?? row.answer ?? row.答え ?? '';
      return [no, String(q), String(a), normType(row.type ?? row.形式)];
    }
    throw new Error(`${i + 1} 番目の要素の形式が違います`);
  });
}

/* 保存・書き出し用。形式なしなら 3 要素のまま (元の list.json と同じ形) */
const toRow = c => (c[3] ? [c[0], c[1], c[2], c[3]] : [c[0], c[1], c[2]]);
const rowsJson = list => JSON.stringify(list.map(toRow), null, 2);

/* ── 採点 ──────────────────────────────────────────────
   全角/半角・大文字小文字・空白・句読点・ひらがな/カタカナの違いは吸収する。
   答えに「A|B」と書くと A でも B でも正解になる。                 */
function norm(s) {
  return String(s).normalize('NFKC')
    .replace(/[\s　]/g, '')
    .replace(/[。、．，.,・]/g, '')
    .toLowerCase()
    .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}

function editDistance(a, b) {
  const prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let diagonal = prev[0];
    prev[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const old = prev[j];
      prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diagonal + (a[i - 1] === b[j - 1] ? 0 : 1));
      diagonal = old;
    }
  }
  return prev[b.length];
}

function judge(input, answer, relaxed = false) {
  const v = norm(input);
  if (!v) return false;
  const alternatives = String(answer).split('|').map(norm).filter(Boolean);
  if (alternatives.includes(v)) return true;
  if (!relaxed) return false;
  return alternatives.some(a => {
    const longest = Math.max(v.length, a.length);
    if (Math.min(v.length, a.length) < 4) return false;
    return editDistance(v, a) <= Math.max(1, Math.floor(longest * .12));
  });
}

/* 表示用は「|」の前だけ (別解は採点にのみ使う) */
/* 別解は行ごとに切る。答え全体を一度に split すると
   「(1)○|o|マル\n(2)×|x|バツ」が「(1)○」だけになってしまう */
const shownAnswer = a => String(a).split('\n')
  .map(line => line.split('|')[0].replace(/\s+$/, ''))
  .join('\n');

/* 「(1)ワード\n(2)ビット」「(1)PNP, (2)アノード」どちらの書き方も拾う */
function answerParts(a) {
  const s = String(a);
  const re = /[（(](\d+)[）)]/g;
  const hits = [];
  let m;
  while ((m = re.exec(s))) hits.push({ n: m[1], start: m.index, end: re.lastIndex });
  return hits.map((h, i) => ({
    n: h.n,
    text: s.slice(h.end, i + 1 < hits.length ? hits[i + 1].start : s.length)
           .replace(/^[\s、,]+/, '').replace(/[\s、,\n]+$/, ''),
  }));
}

/* 「1. 選択肢」の連続した行を持つ記述問題は、番号入力ではなく選択ボタンにする。 */
function multipleChoice(card) {
  if ((card[3] || '') !== 'write') return null;
  const lines = String(card[1]).split('\n');
  const options = [];
  let start = -1;
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(/^\s*(\d+)[.．]\s*(.+)$/);
    if (m) {
      if (start < 0) start = i;
      options.push({ value: m[1], label: `${m[1]}. ${m[2].trim()}` });
    } else if (start >= 0 && lines[i].trim()) {
      break;
    }
  }
  if (options.length < 2) return null;
  return { prompt: lines.slice(0, start).join('\n').trim(), options };
}

const trueFalseValue = answer => {
  const values = String(answer).split('|').map(norm);
  if (values.some(v => v === '○' || v === 'o' || v === 'マル')) return '○';
  if (values.some(v => v === '×' || v === 'x' || v === 'バツ')) return '×';
  return null;
};

/* 問題文に候補が明記されている短い穴埋めもタップ回答にする。 */
function presetChoices(card, answer) {
  if (trueFalseValue(answer)) return [
    { value: '○', label: '○' },
    { value: '×', label: '×' },
  ];
  const q = String(card[1]);
  const first = norm(String(answer).split('|')[0]);
  const sets = [
    { pattern: /上[・／/]下[・／/]左[・／/]右/, values: ['上', '下', '左', '右'] },
    { pattern: /F[、,／/]Z[、,／/]N/i, values: ['F', 'Z', 'N'] },
  ];
  const set = sets.find(s => s.pattern.test(q) && s.values.map(norm).includes(first));
  return set ? set.values.map(v => ({ value: v, label: v })) : null;
}

const seedCards = () => normalizeCards(JSON.parse(document.getElementById('seed-deck').textContent));

/* index.json が読めないとき (file:// で開いた等) の最低限の一覧 */
const FALLBACK_ENTRIES = [{ file: 'semiconductor.json', name: '半導体' }];

function localEntries() {
  try {
    const v = JSON.parse(store.get(LOCAL_KEY) || '[]');
    return Array.isArray(v) ? v.map(e => ({ file: e.file, name: e.name, local: true })) : [];
  } catch (e) { return []; }
}

function saveLocalEntries(list) {
  store.set(LOCAL_KEY, JSON.stringify(list.map(e => ({ file: e.file, name: e.name }))));
}

/* lists/index.json を読む。取れなければキャッシュ→組み込みの順に落とす */
async function loadEntries() {
  let fromNet = null;
  try {
    const res = await fetch('lists/index.json', { cache: 'no-cache' });
    if (res.ok) {
      const raw = await res.json();
      if (Array.isArray(raw) && raw.length) {
        fromNet = raw.map(e => (typeof e === 'string'
          ? { file: e, name: e.replace(/\.json$/i, '') }
          : { file: e.file, name: e.name || String(e.file).replace(/\.json$/i, '') }));
        store.set(cacheKey('index.json'), JSON.stringify(fromNet));
      }
    }
  } catch (e) { /* 圏外・file:// */ }

  let base = fromNet;
  if (!base) {
    try { base = JSON.parse(store.get(cacheKey('index.json')) || 'null'); } catch (e) { base = null; }
  }
  entries = (base && base.length ? base : FALLBACK_ENTRIES).concat(localEntries());
}

/* 形式だけ入っていない古い保存コピーかどうかを判定する。
   以前は編集画面を開いて閉じるだけでも、取得済みデータ全体を「編集」として
   localStorage に保存していた。そのコピーが残ると、後から JSON に追加した
   fill/write/self が永久に読まれないため、内容が同一なら最新版へ戻す。 */
const hasInteractiveType = list => list.some(c => c[3] === 'fill' || c[3] === 'write' || c[3] === 'self');
const sameCardContent = (a, b) => a.length === b.length && a.every((c, i) =>
  String(c[0]) === String(b[i][0]) && c[1] === b[i][1] && c[2] === b[i][2]);

/* 1 ファイル読み込み。実ファイルも確認しつつ本当の編集内容は優先し、
   取れなければ編集済みデータ→キャッシュの順に落とす */
async function loadCards(entry) {
  const edit = store.get(editKey(entry.file));
  let edited = null;
  if (edit) {
    try {
      edited = normalizeCards(JSON.parse(edit));
    } catch (e) { store.del(editKey(entry.file)); }
  }
  isEdited = false;

  if (entry.local) { cards = edited || []; cardSource = '端末'; return; }

  let fresh = null;
  try {
    const res = await fetch('lists/' + entry.file, { cache: 'no-cache' });
    if (res.ok) {
      const text = await res.text();
      fresh = normalizeCards(JSON.parse(text));
      store.set(cacheKey(entry.file), text);
    }
  } catch (e) { /* 圏外・file:// */ }

  if (edited) {
    const staleTypeCopy = fresh
      && !hasInteractiveType(edited)
      && hasInteractiveType(fresh)
      && sameCardContent(edited, fresh);
    if (!staleTypeCopy) {
      cards = edited;
      isEdited = true;
      cardSource = '編集';
      return;
    }
    store.del(editKey(entry.file));
  }

  if (fresh) {
    cards = fresh;
    cardSource = 'ファイル';
    return;
  }

  const cached = store.get(cacheKey(entry.file));
  if (cached) { cards = normalizeCards(JSON.parse(cached)); cardSource = 'キャッシュ'; return; }

  /* 組み込みの初期データ (最初の1ファイルぶんだけ持っている) */
  cards = entry.file === FALLBACK_ENTRIES[0].file ? seedCards() : [];
  cardSource = '組み込み';
}

/* 圏外でも全リストを開けるよう、裏で残りのファイルも取っておく */
function warmCache() {
  entries.filter(e => !e.local && e.file !== activeFile).forEach(e => {
    fetch('lists/' + e.file).then(r => r.ok && r.text())
      .then(t => { if (t) { JSON.parse(t); store.set(cacheKey(e.file), t); } })
      .catch(() => {});
  });
}

/* エディタ側から見た「今のリスト」 */
const currentDeck = () => ({ name: activeName, cards });

/* エディタでの変更は端末内に保存する (元の JSON ファイルは書き換わらない) */
function saveDecks() {
  store.set(editKey(activeFile), rowsJson(cards));
  isEdited = !isLocal(activeFile);
}

/* ══════════════════════════════════════════════════════════
   ダイアログ (console.alert 相当) — 選んだ番号を 1 始まりで返す
   ══════════════════════════════════════════════════════════ */
const dlgLayer = document.getElementById('dlg-layer');
const dlgTitle = document.getElementById('dlg-title');
const dlgMsg   = document.getElementById('dlg-msg');
const dlgOpts  = document.getElementById('dlg-opts');

function alertDialog(title, msg, ...options) {
  return new Promise(resolve => {
    dlgTitle.textContent = title;
    dlgMsg.textContent = msg || '';
    dlgOpts.innerHTML = '';
    options.forEach((opt, i) => {
      const label = typeof opt === 'string' ? opt : opt.label;
      const style = typeof opt === 'string' ? '' : (opt.style || '');
      const b = document.createElement('button');
      b.textContent = label;
      if (style) b.className = style;
      b.addEventListener('click', () => { dlgLayer.classList.remove('on'); resolve(i + 1); });
      dlgOpts.appendChild(b);
    });
    dlgLayer.classList.add('on');
  });
}

/* ══════════════════════════════════════════════════════════
   入力フォーム (問題の追加・編集 / デッキ名など)
   ══════════════════════════════════════════════════════════ */
const formLayer  = document.getElementById('form-layer');
const formTitle  = document.getElementById('form-title');
const formBody   = document.getElementById('form-body');
const formSave   = document.getElementById('form-save');
const formCancel = document.getElementById('form-cancel');
let formResolve = null;

/* fields: [{key, label, value, type:'text'|'textarea', hint, rows}] → 値の object か null */
function openForm(title, fields) {
  return new Promise(resolve => {
    formResolve = resolve;
    formTitle.textContent = title;
    formBody.innerHTML = '';
    fields.forEach(f => {
      const lab = document.createElement('label');
      lab.textContent = f.label;
      lab.htmlFor = 'f_' + f.key;
      let el;
      if (f.type === 'select') {
        el = document.createElement('select');
        (f.options || []).forEach(o => {
          const op = document.createElement('option');
          op.value = o.value;
          op.textContent = o.label;
          el.appendChild(op);
        });
      } else {
        el = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
        if (f.type !== 'textarea') el.type = 'text';
        else el.rows = f.rows || 4;
      }
      el.id = 'f_' + f.key;
      el.dataset.key = f.key;
      el.value = f.value ?? '';
      formBody.appendChild(lab);
      formBody.appendChild(el);
      if (f.hint) {
        const h = document.createElement('div');
        h.className = 'hint';
        h.textContent = f.hint;
        formBody.appendChild(h);
      }
    });
    formLayer.classList.add('on');
    const first = formBody.querySelector('input, textarea');
    if (first) setTimeout(() => first.focus(), 60);
  });
}

function closeForm(result) {
  formLayer.classList.remove('on');
  const r = formResolve;
  formResolve = null;
  if (r) r(result);
}

formCancel.addEventListener('click', () => closeForm(null));
formSave.addEventListener('click', () => {
  const out = {};
  formBody.querySelectorAll('input, textarea, select').forEach(el => { out[el.dataset.key] = el.value; });
  closeForm(out);
});

/* ══════════════════════════════════════════════════════════
   カード画面
   ══════════════════════════════════════════════════════════ */
const elWord = document.getElementById('word');
const elMean = document.getElementById('mean');
const elStat = document.getElementById('stat');
const btnCorrect = document.getElementById('btn-correct');
const btnWrong   = document.getElementById('btn-wrong');
const btnBack    = document.getElementById('btn-back');
const btnRow     = document.getElementById('btnrow');
const btnMenu    = document.getElementById('btn-menu');
const btnExit    = document.getElementById('btn-exit');

const state = {
  allCards: [],
  cards: [],
  index: 0,
  correct: 0,
  attempts: 0,
  history: [],      // [[card, ok], ...]
  wrongCards: [],
  showMean: false,
  jpFirst: false,   // 表示方向 (表=問題 / 表=答え)
  forceFlip: false, // 入力式のカードもめくるだけにする
  mode: 'flip',     // 今出しているカードの形式
  checked: false,   // 答え合わせ済みか
};

/* 答えが複数行なら「番号だけ左端揃え・全体は中央寄せ」で描画。
   フォント測定のため中身は常に .inner で包む */
function renderFace(el, text, dim) {
  el.textContent = '';
  el.classList.toggle('hidden-face', dim);
  const inner = document.createElement('div');
  inner.className = !dim && text.includes('\n') ? 'inner block' : 'inner';
  inner.textContent = text;
  el.appendChild(inner);
}

/* Pythonista の _fit_font 相当 — 枠に収まる最大サイズを二分探索。
   中身 (.inner) は高さ制限を受けないので実寸がそのまま測れる */
function fitFont(el, maxPt, minPt) {
  const inner = el.firstElementChild;

  const search = () => {
    let lo = minPt, hi = maxPt, best = null;
    while (lo <= hi) {
      const mid = Math.floor((lo + hi) / 2);
      el.style.fontSize = mid + 'px';
      if (inner.offsetHeight <= el.clientHeight && inner.scrollWidth <= el.clientWidth + 1) {
        best = mid; lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }
    return best;
  };

  let size = search();
  if (size === null && inner.classList.contains('block')) {
    /* 番号リストが横に入りきらない場合だけ折り返しを許可して測り直す */
    inner.classList.add('wrap');
    size = search();
  }
  el.classList.toggle('scroll', size === null);
  el.style.fontSize = (size === null ? minPt : size) + 'px';
  if (size === null) el.scrollTop = 0;
}

/* このカードをどう出すか。裏返し表示のときは常にめくるだけ */
function cardMode(card) {
  if (state.forceFlip || state.jpFirst) return 'flip';
  const t = card[3] || '';
  if (t === 'fill') return answerParts(card[2]).length ? 'fill' : 'write';
  return (t === 'write' || t === 'self') ? t : 'flip';
}

function presentCard() {
  if (!state.cards.length) return;
  const card = state.cards[state.index];
  const [no, q, a] = card;
  state.mode = cardMode(card);
  /* ラベルの高さが変わるので、フォントを測る前に切り替えておく */
  document.body.classList.toggle('answering', state.mode !== 'flip');

  const choices = state.mode === 'write' ? multipleChoice(card) : null;
  const question = choices ? choices.prompt : q;
  const front = state.jpFirst ? shownAnswer(a) : `${no}. ${question}`;
  renderFace(elWord, front, false);
  fitFont(elWord, 40, 14);

  if (state.mode === 'flip') {
    ansArea.classList.remove('on');
    elMean.style.display = '';
    const back = state.jpFirst ? `${no}. ${q}` : shownAnswer(a);
    renderFace(elMean, state.showMean ? back : '(タップで裏面表示)', !state.showMean);
    fitFont(elMean, 30, 12);
    setBtnMode('flip');
  } else {
    elMean.style.display = 'none';
    ansArea.classList.add('on');
    renderInputs(card);
    setBtnMode(state.checked ? 'checked' : 'input');
  }

  const parts = state.mode === 'fill' ? answerParts(a) : [];
  const choiceUi = choices || parts.some(p => presetChoices(card, p.text));
  const MODE_JA = { flip: 'めくる', fill: choiceUi ? '選択＋穴埋め' : '穴埋め', write: choices ? '選択' : '記述', self: '自己採点' };
  elStat.textContent =
    `${state.index + 1}/${state.cards.length}   正解 ${state.correct}/${state.attempts}`
    + `   [${card[3] || '形式なし'}→${MODE_JA[state.mode]}${state.forceFlip ? '*' : ''}]`;
  btnBack.disabled = state.history.length === 0;
}

/* ── 入力して答える (穴埋め / 記述) ────────────────────── */
const ansArea = document.getElementById('answer-area');
const btnCheck = document.getElementById('btn-check');

function setBtnMode(m) {
  btnRow.classList.toggle('input-mode', m === 'input');
  btnCorrect.classList.remove('suggest');
  btnWrong.classList.remove('suggest');
}

function renderInputs(card) {
  /* 答えが (1)(2)… に分かれていれば、その数だけ入力欄を出す。
     記述式(write)は答えが 1 つなので常に 1 欄 */
  const multiple = state.mode === 'write' ? multipleChoice(card) : null;
  let parts = state.mode === 'write' ? [] : answerParts(card[2]);
  const numbered = parts.length > 0;
  if (multiple) parts = [{ n: '選択', text: card[2], choices: multiple.options }];
  else if (!numbered) parts = [{ n: '答え', text: card[2] }];

  ansArea.innerHTML = '';
  ansArea.classList.toggle('scroll-controls', !!multiple || parts.length > 4);
  parts.forEach((p, i) => {
    const row = document.createElement('div');
    const choices = p.choices || presetChoices(card, p.text);
    row.className = 'ans-row' + (choices ? ' choice-row' : '') + (state.mode === 'self' ? ' self-row' : '');

    const line = document.createElement('div');
    line.className = 'line';

    const label = document.createElement('span');
    label.className = 'n';
    label.textContent = numbered ? `(${p.n})` : p.n;

    const input = document.createElement(state.mode === 'self' ? 'textarea' : 'input');
    input.dataset.answer = p.text;

    if (choices) {
      input.type = 'hidden';
    } else if (state.mode === 'self') {
      input.rows = 3;
      input.placeholder = '覚えている要点をメモ（空欄でも答えを確認できます）';
      input.autocapitalize = 'sentences';
      input.spellcheck = true;
    } else {
      input.type = 'text';
      input.autocomplete = 'off';
      input.autocapitalize = 'off';
      input.spellcheck = false;
      input.enterKeyHint = i + 1 < parts.length ? 'next' : 'done';
      input.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter') return;
        ev.preventDefault();
        const fields = ansArea.querySelectorAll('input[type="text"], textarea');
        const current = [...fields].indexOf(input);
        const next = fields[current + 1];
        if (next) next.focus(); else checkAnswers();
      });
    }

    const mark = document.createElement('span');
    mark.className = 'mark';

    line.append(label, input);
    if (choices) {
      const grid = document.createElement('div');
      const binary = choices.length === 2 && choices.every(c => c.value === '○' || c.value === '×');
      grid.className = 'choice-grid' + (binary ? ' binary' : '') + (choices.some(c => c.label.length > 12) ? ' long' : '');
      choices.forEach(choice => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice-btn';
        button.dataset.value = choice.value;
        button.textContent = choice.label;
        button.addEventListener('click', () => {
          if (state.checked) return;
          input.value = choice.value;
          grid.querySelectorAll('.choice-btn').forEach(b => b.classList.toggle('selected', b === button));
        });
        grid.appendChild(button);
      });
      line.appendChild(grid);
    }
    line.appendChild(mark);
    row.appendChild(line);
    if (state.mode === 'self') {
      const hint = document.createElement('div');
      hint.className = 'answer-hint';
      hint.textContent = '自由記述は完全一致で採点しません。模範解答を見て自分で○×を決めます。';
      row.appendChild(hint);
    }
    ansArea.appendChild(row);
  });

  if (state.checked) showResults();
  else ansArea.scrollTop = 0;
}

function checkAnswers() {
  if (state.checked) return;
  state.checked = true;
  showResults();
  const el = document.activeElement;
  if (el && el.blur) el.blur();       // キーボードを閉じてボタンを出す
  setBtnMode('checked');
  /* 自己採点タイプは○×を出さないので、どちらのボタンも勧めない */
  if (state.mode !== 'self') (state.allOk ? btnCorrect : btnWrong).classList.add('suggest');
}

function showResults() {
  const inputs = [...ansArea.querySelectorAll('input[data-answer], textarea[data-answer]')];

  if (state.mode === 'self') {
    inputs.forEach(input => {
      input.readOnly = true;
      const row = input.closest('.ans-row');
      if (row.querySelector('.correct')) return;
      const c = document.createElement('div');
      c.className = 'correct';
      c.textContent = '模範解答\n' + shownAnswer(input.dataset.answer);
      row.appendChild(c);
    });
    state.allOk = false;
    return;
  }

  let allOk = true;
  inputs.forEach(input => {
    const ok = judge(input.value, input.dataset.answer, state.mode === 'write');
    if (!ok) allOk = false;
    const row = input.closest('.ans-row');
    row.classList.add(ok ? 'ok' : 'ng');
    row.querySelector('.mark').textContent = ok ? '○' : '×';
    input.readOnly = true;
    row.querySelectorAll('.choice-btn').forEach(button => {
      button.disabled = true;
      if (judge(button.dataset.value, input.dataset.answer)) button.classList.add('correct-choice');
      else if (button.classList.contains('selected')) button.classList.add('wrong-choice');
    });
    if (!ok && !row.querySelector('.correct')) {
      const c = document.createElement('div');
      c.className = 'correct';
      c.textContent = shownAnswer(input.dataset.answer);
      row.appendChild(c);
    }
  });
  state.allOk = allOk;
}

function markCorrect() {
  state.history.push([state.cards[state.index], true]);
  state.correct++;
  state.attempts++;
  nextCard();
}

function markWrong() {
  const card = state.cards[state.index];
  state.history.push([card, false]);
  state.wrongCards.push(card);
  state.attempts++;
  nextCard();
}

function goBack() {
  if (!state.history.length) return;
  const [card, ok] = state.history.pop();
  state.index = Math.max(0, state.index - 1);
  if (ok) state.correct--;
  else if (state.wrongCards[state.wrongCards.length - 1] === card) state.wrongCards.pop();
  state.attempts--;
  state.showMean = state.checked = false;
  presentCard();
}

function nextCard() {
  state.showMean = state.checked = false;
  state.index++;
  if (state.index >= state.cards.length) finishDialog();
  else presentCard();
}

const shuffled = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

function resetWith(list, shuffle) {
  /* 空のリストはカード画面を出しようがないのでエディタへ回す */
  if (!list.length) { openEditor(); return; }
  state.cards = shuffle ? shuffled(list) : list.slice();
  state.index = state.correct = state.attempts = 0;
  state.history = [];
  state.wrongCards = [];
  state.showMean = state.checked = false;
  presentCard();
}

async function orderDialog(newCards) {
  let list = newCards;
  if (!list.length) {
    await alertDialog('不正解はありません', '', 'OK');
    list = state.allCards;
  }
  const ch = await alertDialog('順序選択', '', '順番', 'ランダム');
  resetWith(list, ch === 2);
}

async function finishDialog() {
  const ch = await alertDialog('完了', `正解 ${state.correct}/${state.attempts}`,
                               '全部やり直す', '不正解だけ', 'メニューへ');
  if (ch === 1) await orderDialog(state.allCards);
  else if (ch === 2) await orderDialog(state.wrongCards.length ? state.wrongCards : state.allCards);
  else await menuDialog();
}

/* ══════════════════════════════════════════════════════════
   メニュー
   ══════════════════════════════════════════════════════════ */
async function menuDialog() {
  const ch = await alertDialog('メニュー', menuSubtitle(),
    '順番で最初から',
    'シャッフルで最初から',
    '表示方向を切替',
    state.forceFlip ? '入力して答える' : 'めくるだけにする',
    'リストを選ぶ',
    '問題を編集',
    'ファイルの操作',
    'キャンセル');

  if (ch === 1) resetWith(state.allCards, false);
  else if (ch === 2) resetWith(state.allCards, true);
  else if (ch === 3) { state.jpFirst = !state.jpFirst; state.checked = false; presentCard(); }
  else if (ch === 4) { state.forceFlip = !state.forceFlip; state.checked = false; presentCard(); }
  else if (ch === 5) await pickFileDialog();
  else if (ch === 6) openEditor();
  else if (ch === 7) await fileAdminDialog();
}

const menuSubtitle = () =>
  `${activeName} (${cards.length}問)` + (isEdited ? '  ※編集あり' : '')
  + `\nver ${APP_VERSION} / 出典 ${cardSource}`;

/* ── ファイル選択 (Pythonista 版の list*.json 選択に相当) ── */
async function pickFileDialog(startup) {
  let picked = entries[0];
  if (entries.length > 1) {
    const opts = entries.map(e => e.name + (e.local ? ' (端末)' : ''));
    if (!startup) opts.push('キャンセル');
    const ch = await alertDialog('問題リストを選ぶ', '', ...opts);
    if (ch > entries.length) return;
    picked = entries[ch - 1];
  }
  await openEntry(picked);
}

/* リストを読み込んで、順序を聞いて開始 */
async function openEntry(entry) {
  activeFile = entry.file;
  activeName = entry.name;
  store.set(LAST_KEY, entry.file);
  await loadCards(entry);
  state.allCards = cards;
  state.jpFirst = false;
  state.forceFlip = false;   // 前のリストでの «めくるだけ» を持ち越さない

  if (!cards.length) {
    await alertDialog('問題がありません', 'このリストは空です。問題を追加してください。', 'OK');
    openEditor();
    return;
  }
  const ord = await alertDialog('カード順序', 'どの順序で始めますか?', '順番どおり', 'ランダム');
  resetWith(cards, ord === 2);
}

/* ── ファイルの操作: 書き出し / 読み込み / 新規 / 編集の取り消し ── */
async function fileAdminDialog() {
  const local = isLocal(activeFile);
  const acts = [];
  acts.push(['export', 'JSON を書き出す']);
  acts.push(['import', '端末の JSON を読み込む']);
  acts.push(['new',    '新しいリストを作る (端末内)']);
  acts.push(['update', 'アプリの更新を確認']);
  if (!local) acts.push(['revert', { label: 'ファイルを再取得する', style: 'danger' }]);
  if (local)    acts.push(['delete', { label: 'このリストを削除', style: 'danger' }]);
  acts.push(['cancel', 'キャンセル']);

  const ch = await alertDialog('ファイルの操作', menuSubtitle(), ...acts.map(a => a[1]));
  const act = acts[ch - 1][0];

  if (act === 'update') {
    await checkForUpdate(false);
  } else if (act === 'export') {
    await exportJson();
  } else if (act === 'import') {
    importJson();
  } else if (act === 'new') {
    const r = await openForm('新しいリスト', [{ key: 'name', label: 'リスト名', value: '' }]);
    if (!r) return;
    const name = (r.name || '').trim() || '無題';
    addLocalEntry(name, []);
  } else if (act === 'revert') {
    const yes = await alertDialog('再取得しますか?',
                                  `端末に残っている ${activeName} のデータを捨てて\n` +
                                  `lists/${activeFile} を読み直します`,
                                  { label: '再取得', style: 'danger' }, 'やめる');
    if (yes !== 1) return;
    store.del(editKey(activeFile));
    store.del(cacheKey(activeFile));
    await openEntry({ file: activeFile, name: activeName });
  } else if (act === 'delete') {
    const yes = await alertDialog('削除しますか?', `${activeName} (${cards.length}問)`,
                                  { label: '削除する', style: 'danger' }, 'やめる');
    if (yes !== 1) return;
    store.del(editKey(activeFile));
    saveLocalEntries(localEntries().filter(e => e.file !== activeFile));
    entries = entries.filter(e => e.file !== activeFile);
    await openEntry(entries[0]);
  }
}

/* 端末内リストを 1 個増やして、そのまま開く */
async function addLocalEntry(name, list) {
  const file = 'local:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const entry = { file, name, local: true };
  saveLocalEntries(localEntries().concat([entry]));
  entries.push(entry);
  store.set(editKey(file), rowsJson(list));
  activeFile = file;
  activeName = name;
  store.set(LAST_KEY, file);
  cards = list;
  isEdited = false;
  state.allCards = cards;
  if (!cards.length) { openEditor(); return; }
  const ord = await alertDialog('カード順序', 'どの順序で始めますか?', '順番どおり', 'ランダム');
  resetWith(cards, ord === 2);
}

/* ── JSON 入出力 (Pythonista 版の list*.json と互換) ── */
function importJson() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const list = normalizeCards(JSON.parse(String(reader.result)));
        const name = file.name.replace(/\.json$/i, '');
        const ch = await alertDialog('読み込みました', `${name} (${list.length}問)`,
                                     'このリストを始める', 'あとで');
        if (ch === 1) await addLocalEntry(name, list);
        else {
          const f = 'local:' + Date.now().toString(36);
          saveLocalEntries(localEntries().concat([{ file: f, name }]));
          entries.push({ file: f, name, local: true });
          store.set(editKey(f), rowsJson(list));
        }
      } catch (e) {
        await alertDialog('読み込めません', String(e.message || e), 'OK');
      }
    };
    reader.readAsText(file, 'utf-8');
  });
  input.click();
}

/* ブラウザによっては日本語のファイル名が捨てられて拡張子まで失われるので
   ASCII のファイル名にそろえる。lists/ 由来ならその名前をそのまま使う */
function exportFileName() {
  if (!isLocal(activeFile)) return activeFile;
  const ascii = activeName.replace(/[^\w.\- ]+/g, '').trim().replace(/\s+/g, '_');
  return (ascii || 'list') + '.json';
}

async function exportJson() {
  const name = exportFileName();
  const blob = new Blob([rowsJson(cards)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  await alertDialog('書き出しました', `${name}\n(${cards.length}問)`, 'OK');
}

/* ══════════════════════════════════════════════════════════
   エディタ
   ══════════════════════════════════════════════════════════ */
const editor  = document.getElementById('editor');
const edList  = document.getElementById('ed-list');
const edTitle = document.getElementById('ed-title');

function openEditor() {
  editor.classList.add('on');
  renderEditor();
}

function closeEditor() {
  editor.classList.remove('on');
  const d = currentDeck();
  state.allCards = d.cards;
  if (!d.cards.length) {
    alertDialog('問題がありません', 'このリストは空です。問題を追加してください。', 'OK')
      .then(() => openEditor());
    return;
  }
  /* 編集後は現在のリストで最初から */
  resetWith(state.allCards, false);
}

function renderEditor() {
  const d = currentDeck();
  edTitle.textContent = `${d.name} (${d.cards.length}問)`;
  edList.innerHTML = '';

  if (!d.cards.length) {
    const empty = document.createElement('div');
    empty.className = 'ed-empty';
    empty.textContent = 'まだ問題がありません。\n右上の「＋ 追加」から作れます。';
    empty.style.whiteSpace = 'pre-wrap';
    edList.appendChild(empty);
    return;
  }

  d.cards.forEach((card, i) => {
    const box = document.createElement('div');
    box.className = 'ed-card';

    const no = document.createElement('div');
    no.className = 'no';
    no.textContent = `No. ${card[0]}` + (card[3] ? `  ・  ${TYPE_LABEL[card[3]]}` : '');

    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = card[1];

    const a = document.createElement('div');
    a.className = 'a';
    a.textContent = card[2];

    const row = document.createElement('div');
    row.className = 'row';
    row.appendChild(mkEdBtn('編集', () => editCard(i)));
    row.appendChild(mkEdBtn('↑', () => moveCard(i, -1)));
    row.appendChild(mkEdBtn('↓', () => moveCard(i, +1)));
    const del = mkEdBtn('削除', () => deleteCard(i));
    del.className = 'del';
    row.appendChild(del);

    box.append(no, q, a, row);
    edList.appendChild(box);
  });
}

function mkEdBtn(label, fn) {
  const b = document.createElement('button');
  b.textContent = label;
  b.addEventListener('click', fn);
  return b;
}

const TYPE_LABEL = {
  '': 'めくるだけ', fill: '穴埋め入力', write: '記述式(自動採点)', self: '記述式(自己採点)',
};

const CARD_FIELDS = (no, q, a, type) => ([
  { key: 'no', label: '番号', value: no,
    hint: '教科書の問題番号など。表面に「番号. 問題文」として出ます。' },
  { key: 'type', label: '形式', value: type || '', type: 'select',
    options: TYPES.map(t => ({ value: t, label: TYPE_LABEL[t] })),
    hint: '穴埋め入力: 問題文の (1)(2)… に対応する入力欄が出ます。\n'
        + '記述式(自動採点): 用語など短い答え向け。○×が付きます。\n'
        + '記述式(自己採点): 長い説明向け。模範解答だけ出るので自分で ✔/✘ を押します。' },
  { key: 'q', label: '問題文', value: q, type: 'textarea', rows: 6 },
  { key: 'a', label: '答え', value: a, type: 'textarea', rows: 7,
    hint: '改行で区切ると、(1)(2)… の行が左端揃えで縦に並びます。\n'
        + '「ホール|正孔」のように | で区切ると、どちらでも正解になります。' },
]);

async function editCard(i) {
  const d = currentDeck();
  const c = d.cards[i];
  const r = await openForm('問題の編集', CARD_FIELDS(c[0], c[1], c[2], c[3]));
  if (!r) return;
  d.cards[i] = [parseNo(r.no), r.q.trim(), r.a.trim(), normType(r.type)];
  saveDecks();
  renderEditor();
}

async function addCard() {
  const d = currentDeck();
  const last = d.cards[d.cards.length - 1];
  const nextNo = d.cards.length ? (Number(last[0]) || d.cards.length) + 1 : 1;
  const r = await openForm('問題の追加', CARD_FIELDS(nextNo, '', '', last ? last[3] : ''));
  if (!r) return;
  if (!r.q.trim() && !r.a.trim()) return;
  d.cards.push([parseNo(r.no), r.q.trim(), r.a.trim(), normType(r.type)]);
  saveDecks();
  renderEditor();
  edList.scrollTop = edList.scrollHeight;
}

/* 番号は数字なら数値、それ以外は文字列のまま保持 */
function parseNo(v) {
  const s = String(v ?? '').trim();
  return /^-?\d+$/.test(s) ? Number(s) : (s || 0);
}

async function deleteCard(i) {
  const d = currentDeck();
  const ch = await alertDialog('削除しますか?', `No. ${d.cards[i][0]}`,
                               { label: '削除する', style: 'danger' }, 'やめる');
  if (ch !== 1) return;
  d.cards.splice(i, 1);
  saveDecks();
  renderEditor();
}

function moveCard(i, dir) {
  const d = currentDeck();
  const j = i + dir;
  if (j < 0 || j >= d.cards.length) return;
  [d.cards[i], d.cards[j]] = [d.cards[j], d.cards[i]];
  saveDecks();
  renderEditor();
}

document.getElementById('ed-add').addEventListener('click', addCard);
document.getElementById('ed-close').addEventListener('click', closeEditor);

/* ══════════════════════════════════════════════════════════
   イベント
   ══════════════════════════════════════════════════════════ */
btnCorrect.addEventListener('click', markCorrect);
btnWrong.addEventListener('click', markWrong);
btnBack.addEventListener('click', goBack);
btnMenu.addEventListener('click', menuDialog);
btnExit.addEventListener('click', async () => {
  const ch = await alertDialog('終了しますか?', '成績はリセットされます', '最初に戻る', 'キャンセル');
  if (ch === 1) await startDialog();
});

/* 画面タップで裏表を切り替え (ボタン上は無視) */
document.getElementById('card-view').addEventListener('click', ev => {
  if (ev.target.closest('button, #answer-area')) return;
  if (state.mode !== 'flip') return;   // 入力式のカードはめくらない
  state.showMean = !state.showMean;
  presentCard();
});

btnCheck.addEventListener('click', checkAnswers);

/* ソフトキーボードの高さを CSS に流して、解答欄が隠れないようにする */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const syncKb = () => {
    const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
    document.body.classList.toggle('kb-open', kb > 60);
  };
  vv.addEventListener('resize', syncKb);
  vv.addEventListener('scroll', syncKb);
}

/* PC 用ショートカット */
document.addEventListener('keydown', ev => {
  if (dlgLayer.classList.contains('on') || formLayer.classList.contains('on')
      || editor.classList.contains('on')) return;
  if (ev.target.matches('input, textarea, select')) return;
  if (state.mode !== 'flip' && !state.checked) return;
  if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); state.showMean = !state.showMean; presentCard(); }
  else if (ev.key === 'ArrowRight' || ev.key === 'o') markCorrect();
  else if (ev.key === 'ArrowDown' || ev.key === 'x') markWrong();
  else if (ev.key === 'ArrowLeft') goBack();
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!state.cards.length) return;
    if (state.mode !== 'flip') fitFont(elWord, 40, 14);   // 入力内容を消さない
    else presentCard();
  }, 80);
});

/* ══════════════════════════════════════════════════════════
   起動
   ══════════════════════════════════════════════════════════ */
async function startDialog() {
  /* Pythonista 版の load_word_list() と同じ流れ:
     lists/ の JSON を一覧 → 1 個なら即決、複数なら選ばせる → 順序を聞く */
  checkForUpdate(true);          // 版が古ければ勝手に直す (待たない)
  await loadEntries();
  await pickFileDialog(true);
  warmCache();
}

startDialog();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  /* updateViaCache:'none' で sw.js 自体がキャッシュから読まれるのを防ぎ、
     起動のたびに更新を確認する。新しい版が来たら次回起動から有効になる */
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
    .then(reg => {
      reg.update().catch(() => {});
      if (reg.waiting) reg.waiting.postMessage('skip-waiting');
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (sw) sw.addEventListener('statechange', () => {
          if (sw.state === 'installed') sw.postMessage('skip-waiting');
        });
      });
    })
    .catch(() => {});
}
</script>
